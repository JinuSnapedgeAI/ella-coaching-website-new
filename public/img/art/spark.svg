<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A glowing spark of inspiration — single clarity session">
<defs>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8ed" stop-opacity=".6"/><stop offset="1" stop-color="#f2d5cf" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="500" fill="#f2d5cf"/>
<circle cx="400" cy="250" r="220" fill="url(#glow)"/>
<!-- soft background shapes -->
<circle cx="560" cy="150" r="160" fill="#e3dcef" opacity=".4"/>
<circle cx="170" cy="380" r="130" fill="#fbe3c8" opacity=".4"/>
<circle cx="650" cy="400" r="80" fill="#d5e2d6" opacity=".3"/>
<!-- central sparkle / star -->
<g fill="#fffaf6">
<!-- main 4-point star -->
<path d="M400 100 C414 200 440 226 540 250 C440 274 414 300 400 400 C386 300 360 274 260 250 C360 226 386 200 400 100Z"/>
<!-- smaller stars -->
<path d="M590 120 C594 155 606 165 645 170 C606 175 594 185 590 220 C586 185 574 175 535 170 C574 165 586 155 590 120Z" opacity=".8"/>
<path d="M200 80 C203 108 212 116 242 120 C212 124 203 132 200 160 C197 132 188 124 158 120 C188 116 197 108 200 80Z" opacity=".8"/>
<path d="M620 340 C623 360 628 365 652 368 C628 371 623 376 620 396 C617 376 612 371 588 368 C612 365 617 360 620 340Z" opacity=".7"/>
<path d="M180 310 C182 325 186 328 205 330 C186 332 182 335 180 350 C178 335 174 332 155 330 C174 328 178 325 180 310Z" opacity=".6"/>
</g>
<!-- tiny floating dots -->
<g fill="#fffaf6" opacity=".6">
<circle cx="300" cy="140" r="3"/><circle cx="520" cy="380" r="3"/>
<circle cx="140" cy="200" r="2"/><circle cx="680" cy="250" r="2"/>
<circle cx="350" cy="420" r="2"/><circle cx="460" cy="80" r="2"/>
</g>
<!-- warm ring around main star -->
<circle cx="400" cy="250" r="120" fill="none" stroke="#fbe3c8" stroke-width="1" opacity=".4"/>
<circle cx="400" cy="250" r="170" fill="none" stroke="#fbe3c8" stroke-width="1" opacity=".2" stroke-dasharray="4 8"/>
</svg>