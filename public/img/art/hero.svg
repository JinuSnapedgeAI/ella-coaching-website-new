<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-label="A confident woman standing on a hilltop at sunrise, arms raised in triumph">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8cfe6"/><stop offset=".35" stop-color="#e3dcef"/><stop offset=".65" stop-color="#f2d5cf"/><stop offset="1" stop-color="#f7e6d8"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".48" r=".42"><stop offset="0" stop-color="#fff6e6" stop-opacity=".95"/><stop offset=".5" stop-color="#fbe3c8" stop-opacity=".5"/><stop offset="1" stop-color="#fff6e6" stop-opacity="0"/></radialGradient>
<radialGradient id="sunCore" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8ed"/><stop offset=".6" stop-color="#fbe3c8"/><stop offset="1" stop-color="#f2d5cf" stop-opacity="0"/></radialGradient>
<linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d2ea"/><stop offset="1" stop-color="#c9bfdd"/></linearGradient>
<linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d5e2d6"/><stop offset="1" stop-color="#b8d0ba"/></linearGradient>
<linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd2bf"/><stop offset="1" stop-color="#a1c4a5"/></linearGradient>
</defs>
<!-- sky -->
<rect width="1400" height="1000" fill="url(#sky)"/>
<!-- sun glow -->
<circle cx="700" cy="500" r="420" fill="url(#glow)"/>
<!-- sun rays (subtle) -->
<g opacity=".12" stroke="#fbe3c8" stroke-width="3" fill="none">
<line x1="700" y1="280" x2="700" y2="180"/>
<line x1="700" y1="280" x2="620" y2="195" />
<line x1="700" y1="280" x2="780" y2="195"/>
<line x1="700" y1="280" x2="555" y2="240"/>
<line x1="700" y1="280" x2="845" y2="240"/>
<line x1="700" y1="280" x2="510" y2="310"/>
<line x1="700" y1="280" x2="890" y2="310"/>
</g>
<!-- sun disc -->
<circle cx="700" cy="480" r="160" fill="url(#sunCore)"/>
<circle cx="700" cy="480" r="110" fill="#fbe3c8" opacity=".5"/>
<!-- clouds -->
<g fill="#fff" opacity=".65">
<ellipse cx="180" cy="170" rx="120" ry="24"/><ellipse cx="270" cy="152" rx="80" ry="20"/>
<ellipse cx="1130" cy="220" rx="140" ry="26"/><ellipse cx="1230" cy="202" rx="85" ry="20"/>
<ellipse cx="560" cy="120" rx="70" ry="14"/><ellipse cx="620" cy="112" rx="50" ry="12"/>
<ellipse cx="1000" cy="150" rx="60" ry="12"/>
</g>
<!-- birds in distance -->
<g stroke="#9b919f" stroke-width="2" fill="none" opacity=".4">
<path d="M320 250 Q330 240 340 250"/><path d="M350 245 Q360 235 370 245"/>
<path d="M1050 190 Q1060 180 1070 190"/><path d="M1080 185 Q1090 175 1100 185"/>
</g>
<!-- distant mountains -->
<path d="M0 680 C150 610 280 560 400 590 C520 620 600 650 700 640 C800 630 950 560 1100 600 C1200 620 1350 610 1400 650 V1000 H0Z" fill="url(#hill1)" opacity=".6"/>
<!-- rolling hills -->
<path d="M0 730 C200 660 380 690 560 720 C720 748 880 700 1050 720 C1180 735 1320 690 1400 710 V1000 H0Z" fill="url(#hill2)"/>
<!-- wildflowers on hills -->
<g opacity=".6">
<circle cx="200" cy="740" r="4" fill="#eab7ae"/><circle cx="220" cy="748" r="3" fill="#f2d5cf"/>
<circle cx="350" cy="720" r="4" fill="#e3dcef"/><circle cx="370" cy="728" r="3" fill="#d5e2d6"/>
<circle cx="900" cy="718" r="4" fill="#eab7ae"/><circle cx="920" cy="725" r="3" fill="#f4cfc7"/>
<circle cx="1100" cy="730" r="4" fill="#e3dcef"/><circle cx="1130" cy="738" r="3" fill="#d5e2d6"/>
<circle cx="500" cy="732" r="3" fill="#f4cfc7"/><circle cx="1250" cy="705" r="3" fill="#eab7ae"/>
</g>
<!-- foreground hill -->
<path d="M0 850 C250 790 500 830 700 820 C900 810 1100 780 1250 810 C1350 830 1400 820 1400 840 V1000 H0Z" fill="url(#hill3)"/>
<!-- grass tufts -->
<g stroke="#8fb894" stroke-width="2" fill="none" opacity=".5">
<path d="M100 860 Q105 840 110 860"/><path d="M108 862 Q115 838 120 862"/>
<path d="M300 840 Q305 820 310 840"/><path d="M308 842 Q315 818 320 842"/>
<path d="M1200 830 Q1205 810 1210 830"/><path d="M1208 832 Q1215 808 1220 832"/>
<path d="M1050 850 Q1055 830 1060 850"/>
</g>
<!-- figure (woman with raised arms) -->
<g transform="translate(700 810)">
<!-- dress / body -->
<path d="M-52 -10 C-44 -180 -32 -260 0 -270 C32 -260 44 -180 52 -10 C22 16 -22 16 -52 -10Z" fill="#8f7aa8"/>
<!-- dress highlights -->
<path d="M-20 -10 C-18 -120 -10 -200 0 -270 C-15 -200 -25 -120 -30 -10Z" fill="#a08dba" opacity=".5"/>
<!-- arms raised triumphantly -->
<path d="M-50 -235 C-90 -290 -120 -355 -135 -430 C-140 -455 -138 -465 -130 -460" stroke="#f1c9b8" stroke-width="24" stroke-linecap="round" fill="none"/>
<path d="M50 -235 C90 -290 120 -355 135 -430 C140 -455 138 -465 130 -460" stroke="#f1c9b8" stroke-width="24" stroke-linecap="round" fill="none"/>
<!-- fingers spread (left) -->
<g stroke="#f1c9b8" stroke-width="6" stroke-linecap="round" fill="none">
<path d="M-130 -460 C-138 -478 -140 -488 -136 -495"/>
<path d="M-130 -460 C-125 -480 -120 -490 -118 -495"/>
<path d="M-130 -460 C-145 -472 -152 -478 -155 -485"/>
</g>
<!-- fingers spread (right) -->
<g stroke="#f1c9b8" stroke-width="6" stroke-linecap="round" fill="none">
<path d="M130 -460 C138 -478 140 -488 136 -495"/>
<path d="M130 -460 C125 -480 120 -490 118 -495"/>
<path d="M130 -460 C145 -472 152 -478 155 -485"/>
</g>
<!-- neck -->
<rect x="-18" y="-310" width="36" height="55" rx="16" fill="#f1c9b8"/>
<!-- head -->
<ellipse cx="0" cy="-350" rx="48" ry="56" fill="#f1c9b8"/>
<!-- hair -->
<path d="M-50 -360 C-56 -420 -10 -430 40 -410 C58 -395 55 -350 50 -310 C38 -370 10 -395 -30 -385 C-48 -378 -52 -370 -50 -360Z" fill="#4a3f4f"/>
<!-- hair flowing -->
<path d="M-50 -350 C-54 -310 -50 -260 -42 -230" stroke="#4a3f4f" stroke-width="14" stroke-linecap="round" fill="none"/>
<path d="M50 -340 C56 -300 54 -260 48 -230" stroke="#4a3f4f" stroke-width="10" stroke-linecap="round" fill="none"/>
<!-- face features -->
<circle cx="-16" cy="-360" r="5" fill="#4a3f4f"/>
<circle cx="16" cy="-360" r="5" fill="#4a3f4f"/>
<path d="M-12 -332 Q0 -320 12 -332" stroke="#c98f86" stroke-width="5" stroke-linecap="round" fill="none"/>
<!-- blush -->
<circle cx="-28" cy="-342" r="12" fill="#eaa79b" opacity=".4"/>
<circle cx="28" cy="-342" r="12" fill="#eaa79b" opacity=".4"/>
</g>
<!-- sparkles around the figure -->
<g fill="#fffaf6" opacity=".85">
<circle cx="540" cy="340" r="5"/><circle cx="870" cy="310" r="4"/><circle cx="1000" cy="440" r="5"/>
<circle cx="420" cy="460" r="4"/><circle cx="630" cy="280" r="3"/><circle cx="780" cy="290" r="3"/>
</g>
<!-- floating sparkle stars -->
<g fill="#fffaf6" opacity=".7">
<path d="M520 380 C524 400 530 406 550 410 C530 414 524 420 520 440 C516 420 510 414 490 410 C510 406 516 400 520 380Z" transform="scale(.5) translate(200 200)"/>
<path d="M880 350 C883 365 888 370 905 373 C888 376 883 381 880 396 C877 381 872 376 855 373 C872 370 877 365 880 350Z" transform="scale(.4) translate(800 200)"/>
</g>
<!-- butterflies -->
<g transform="translate(480 390)" opacity=".5">
<path d="M0 0 C-15 -12 -22 -8 -18 2 C-22 12 -15 16 0 4Z" fill="#e3dcef"/>
<path d="M0 0 C15 -12 22 -8 18 2 C22 12 15 16 0 4Z" fill="#d5e2d6"/>
</g>
<g transform="translate(920 360) scale(.7)" opacity=".4">
<path d="M0 0 C-15 -12 -22 -8 -18 2 C-22 12 -15 16 0 4Z" fill="#f2d5cf"/>
<path d="M0 0 C15 -12 22 -8 18 2 C22 12 15 16 0 4Z" fill="#e3dcef"/>
</g>
</svg>